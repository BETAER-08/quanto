name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: comments
        run: go run scripts/check-comments.go
      - name: test
        run: go test -race ./...
      - name: fetch corpus
        run: ./scripts/fetch-corpus.sh
      - name: corpus tests
        run: go test -run Corpus ./...
      - name: fuzz FuzzLoad
        run: go test -run '^$' -fuzz FuzzLoad -fuzztime 20s -fuzzminimizetime 5s ./core/source/
      - name: fuzz FuzzParseTemplate
        run: go test -run '^$' -fuzz FuzzParseTemplate -fuzztime 20s -fuzzminimizetime 5s ./core/expr/
      - name: fuzz FuzzExpand
        run: go test -run '^$' -fuzz FuzzExpand -fuzztime 20s -fuzzminimizetime 5s ./core/matrix/
