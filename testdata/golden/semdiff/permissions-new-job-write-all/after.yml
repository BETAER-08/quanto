name: Release
on: push
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make dist
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: make publish
  tag:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - run: make tag
