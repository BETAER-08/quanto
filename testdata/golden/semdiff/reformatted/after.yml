# Continuous integration for the main branch.
jobs:
  lint:
    steps:
      - {uses: "actions/checkout@v4"}
      - uses: "golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9"
      - run: "make lint"
    permissions: {checks: write, contents: read}
    needs: [build]
    runs-on: &runner "ubuntu-latest"

  build:
    steps:
      - uses: 'actions/checkout@v4'  # checkout first
      - with: {go-version: "${{ matrix.go }}"}
        uses: actions/setup-go@v5
      - env:
          TOKEN: '${{ secrets.API_TOKEN }}'
        run: go test ./...
    strategy:
      matrix:
        include: [{os: ubuntu-latest, race: true}]
        os:
          - ubuntu-latest
          - windows-latest
        go:
          - "1.22"
          - "1.23"
      fail-fast: false
    timeout-minutes: '30'
    runs-on: *runner

concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}
permissions:
  pull-requests: write
  contents: read
"on":
  schedule: [{cron: "0 3 * * *"}]
  pull_request: {types: [synchronize, opened]}
  push: {branches: ["release/**", main]}
name: "CI"
