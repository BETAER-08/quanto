name: CI
on:
  push:
    branches: [main, 'release/**']
  pull_request:
    types: [opened, synchronize]
  schedule:
    - cron: '0 3 * * *'
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: ['1.22', '1.23']
        include:
          - os: ubuntu-latest
            race: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go test ./...
        env:
          TOKEN: ${{ secrets.API_TOKEN }}
  lint:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9
      - run: make lint
