name: CI
on: push
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.list.outputs.os }}
    steps:
      - id: list
        run: echo 'os=["ubuntu-latest","windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
  test:
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - run: make test
