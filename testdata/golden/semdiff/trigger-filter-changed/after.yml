name: CI
on:
  push:
    branches:
      - main
      - 'release/**'
      - 'hotfix/**'
    paths:
      - 'src/**'
      - go.sum
  pull_request:
    branches: [main, develop]
    paths-ignore: ['docs/**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test
